name: Build and Push Custom Silverblue Image

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 04:00 UTC every Sunday (Sunday Funday)
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Buildah Build
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: custom-silverblue
          tags: latest 44
          containerfiles: |
            ./Containerfile

      - name: Log in to Codeberg Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: codeberg.org
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Codeberg Registry
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: codeberg.org/${{ gitea.repository_owner }}