name: Build, Push and Sign cobaltblue

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  # Daily rebuild, done before clients check for updates at 04:00 local time
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cobaltblue

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Newest stable Fedora from Bodhi, but at least MIN_FEDORA_VERSION
      - name: Detect newest Fedora release
        env:
          MIN_FEDORA_VERSION: 45
        run: |
          FEDORA_VERSION="$({ echo "$MIN_FEDORA_VERSION"
              curl -fsSL "https://bodhi.fedoraproject.org/releases/?state=current&rows_per_page=100" \
                | jq -r '.releases[] | select(.id_prefix == "FEDORA") | .version'
            } | grep -E '^[0-9]+$' | sort -n | tail -n1)"
          if ! [[ "$FEDORA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Could not detect the Fedora release" >&2
            exit 1
          fi
          echo "Building on Fedora $FEDORA_VERSION"
          echo "FEDORA_VERSION=$FEDORA_VERSION" >> "$GITHUB_ENV"
          echo "DATE_TAG=$FEDORA_VERSION-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Room for the build plus the rechunked copy
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      # sudo avoids rootless cgroup crashes; keep REGISTRY_AUTH_FILE for push auth
      - name: Build Image
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE buildah bud \
            --authfile "$REGISTRY_AUTH_FILE" \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --tag localhost/cobaltblue:build \
            --file ./Containerfile .

      # Stable package-based layers, so updates only download what changed
      - name: Rechunk Image
        id: rechunk
        uses: hhd-dev/rechunk@v1.2.4
        with:
          rechunk: ghcr.io/hhd-dev/rechunk:v1.2.4  # keep in sync with the action version
          ref: localhost/cobaltblue:build
          prev-ref: ${{ env.IMAGE }}:latest
          version: ${{ env.DATE_TAG }}
          labels: |
            containers.bootc=1
            ostree.bootable=1
            org.opencontainers.image.title=cobaltblue
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # All tags share one digest; sudo because the rechunked output is root-owned
      - name: Push Image
        run: |
          for tag in latest "$FEDORA_VERSION" "$DATE_TAG"; do
            sudo --preserve-env=REGISTRY_AUTH_FILE skopeo copy --retry-times 3 \
              --authfile "$REGISTRY_AUTH_FILE" \
              --digestfile /tmp/digest \
              "${{ steps.rechunk.outputs.ref }}" "docker://$IMAGE:$tag"
          done
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      # cosign 3's bundle format isn't found by rpm-ostree; stay on 2.x
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      # Signing the digest covers all tags
      - name: Sign Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''  # key has no password
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      # Keep about two weeks of builds (each build is an image plus a signature)
      - name: Delete old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: cobaltblue
          package-type: container
          min-versions-to-keep: 30