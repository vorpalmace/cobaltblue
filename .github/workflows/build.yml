name: Build and Push Custom Silverblue

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Direct Buildah command unmasks all DNF & build errors in stdout/stderr
      - name: Build Image with Full Log Output
        run: |
          buildah bud \
            --isolation=chroot \
            --tag ghcr.io/${{ github.repository_owner }}/cobaltblue:latest \
            --file ./Containerfile .

      - name: Push to Registry
        run: |
          podman push ghcr.io/${{ github.repository_owner }}/cobaltblue:latest