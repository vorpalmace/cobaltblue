name: Build, Push and Sign cobaltblue

on:
  push:
    branches:
      - main
  # Daily rebuild for Fedora updates
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cobaltblue

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Highest "current" release from Bodhi (never betas or Rawhide)
      - name: Detect current stable Fedora release
        run: |
          FEDORA_VERSION="$(curl -fsSL 'https://bodhi.fedoraproject.org/releases/?state=current&rows_per_page=100' \
            | jq -r '.releases[] | select(.id_prefix == "FEDORA") | .version' \
            | grep -E '^[0-9]+$' | sort -n | tail -n1)"
          if ! [[ "$FEDORA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Could not detect the Fedora release" >&2
            exit 1
          fi
          echo "Building on Fedora $FEDORA_VERSION"
          echo "FEDORA_VERSION=$FEDORA_VERSION" >> "$GITHUB_ENV"
          echo "DATE_TAG=$FEDORA_VERSION-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sudo avoids rootless cgroup crashes; keep REGISTRY_AUTH_FILE for push auth
      - name: Build Image
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE buildah bud \
            --authfile "$REGISTRY_AUTH_FILE" \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$FEDORA_VERSION" \
            --tag "$IMAGE:$DATE_TAG" \
            --file ./Containerfile .

      # All tags share one digest
      - name: Push Image
        run: |
          for tag in latest "$FEDORA_VERSION" "$DATE_TAG"; do
            sudo --preserve-env=REGISTRY_AUTH_FILE podman push \
              --authfile "$REGISTRY_AUTH_FILE" \
              --digestfile /tmp/digest \
              "$IMAGE:$tag"
          done
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      # cosign 3's bundle format isn't found by rpm-ostree; stay on 2.x
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      # Signing the digest covers all tags
      - name: Sign Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"