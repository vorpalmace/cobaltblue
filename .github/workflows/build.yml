name: Build and Push Custom Silverblue

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Running with sudo bypasses all user namespace / cgroup 125 crashes
      - name: Build Image (Verbose & Root)
        run: |
          sudo buildah bud \
            --debug \
            --loglevel 5 \
            --tag ghcr.io/${{ github.repository_owner }}/cobaltblue:latest \
            --file ./Containerfile .

      - name: Push Image
        run: |
          sudo podman push ghcr.io/${{ github.repository_owner }}/cobaltblue:latest