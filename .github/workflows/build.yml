name: Build, Push and Sign cobaltblue

on:
  push:
    branches:
      - main
  # Build every day at 04:00 UTC to pull the latest Fedora updates
  schedule:
    - cron: '0 4 * * *'
  # Allows triggering builds manually from the Actions tab
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cobaltblue

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Ask Fedora's update system (Bodhi) for the currently supported releases
      # and take the highest one. Only released versions are "current", so
      # betas and Rawhide are never picked.
      - name: Detect current stable Fedora release
        run: |
          FEDORA_VERSION="$(curl -fsSL 'https://bodhi.fedoraproject.org/releases/?state=current&rows_per_page=100' \
            | jq -r '.releases[] | select(.id_prefix == "FEDORA") | .version' \
            | grep -E '^[0-9]+$' | sort -n | tail -n1)"
          if ! [[ "$FEDORA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Could not detect the Fedora release" >&2
            exit 1
          fi
          echo "Building on Fedora $FEDORA_VERSION"
          echo "FEDORA_VERSION=$FEDORA_VERSION" >> "$GITHUB_ENV"
          echo "DATE_TAG=$FEDORA_VERSION-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Running with sudo bypasses user namespace / cgroup 125 crashes.
      # sudo strips the environment by default, so REGISTRY_AUTH_FILE (set by
      # podman-login) has to be preserved explicitly or the push fails auth.
      - name: Build Image
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE buildah bud \
            --authfile "$REGISTRY_AUTH_FILE" \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$FEDORA_VERSION" \
            --tag "$IMAGE:$DATE_TAG" \
            --file ./Containerfile .

      # All tags point to the same image, so they share one digest
      - name: Push Image
        run: |
          for tag in latest "$FEDORA_VERSION" "$DATE_TAG"; do
            sudo --preserve-env=REGISTRY_AUTH_FILE podman push \
              --authfile "$REGISTRY_AUTH_FILE" \
              --digestfile /tmp/digest \
              "$IMAGE:$tag"
          done
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      # Pinned to cosign 2.x: cosign 3 defaults to the new bundle format,
      # which rpm-ostree's use-sigstore-attachments lookup can't find
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.5'

      # Signing the digest covers every tag of this build
      - name: Sign Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"