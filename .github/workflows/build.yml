name: Build and Push Custom Silverblue

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Running with sudo bypasses all user namespace / cgroup 125 crashes.
      # sudo strips the environment by default, so REGISTRY_AUTH_FILE (set by
      # podman-login) would otherwise be invisible to root and the push
      # would fail auth even though the login step "succeeded".
      - name: Build Image (Verbose & Root)
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE buildah bud \
            --debug \
            --loglevel 5 \
            --authfile "$REGISTRY_AUTH_FILE" \
            --tag ghcr.io/${{ github.repository_owner }}/cobaltblue:latest \
            --file ./Containerfile .

      - name: Push Image
        run: |
          sudo --preserve-env=REGISTRY_AUTH_FILE podman push \
            --authfile "$REGISTRY_AUTH_FILE" \
            ghcr.io/${{ github.repository_owner }}/cobaltblue:latest